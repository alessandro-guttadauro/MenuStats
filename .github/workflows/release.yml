# Every push to main (direct commits and merged pull requests) that changes the app publishes a new release,
# which the app's updater then offers to users. Documentation-only pushes ship with the next release (the zip
# would be identical). The version bumps the patch number; write [minor] or [major] in a commit message to
# bump those instead, or [skip release] to publish nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            echo "HEAD is already released as $LAST"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RANGE="$LAST..HEAD"; [ "$LAST" = v0.0.0 ] && RANGE=HEAD
          MESSAGES=$(git log --format=%B "$RANGE")
          if echo "$MESSAGES" | grep -qF '[skip release]'; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$(git log --format=%H "$RANGE" -- Sources Resources scripts Package.swift .github)" ]; then
            echo "Only documentation changed since $LAST"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          if echo "$MESSAGES" | grep -qF '[major]'; then MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MESSAGES" | grep -qF '[minor]'; then MINOR=$((MINOR + 1)); PATCH=0
          else PATCH=$((PATCH + 1)); fi
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## Novità"
            git log --no-merges --format='- %s' "$RANGE" | sed -E 's/ ?\[(minor|major)\]//g'
            echo
            echo
            echo "## Installazione"
            echo "Se hai già MenuStats 1.3.0 o successivo, l'aggiornamento compare da solo nella barra dei menu: un clic e si installa."
            echo "Altrimenti scarica \`MenuStats-$VERSION.zip\`, estrai e sostituisci \`MenuStats.app\`; al primo avvio clic destro ▸ **Apri** (app non notarizzata)."
            echo
            echo "Requisiti: Mac con Apple Silicon, macOS 13 o successivo (macOS 14 per i widget)."
          } > notes.md
          cat notes.md

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -version
          ./scripts/build-app.sh
          codesign --verify --deep --strict build/MenuStats.app
          ditto -c -k --sequesterRsrc --keepParent build/MenuStats.app "MenuStats-$VERSION.zip"

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '\nSHA-256 di `MenuStats-%s.zip`: `%s`\n' "$VERSION" "$(shasum -a 256 "MenuStats-$VERSION.zip" | cut -d' ' -f1)" >> notes.md
          # GitHub appends the merged pull requests with their authors.
          gh release create "v$VERSION" "MenuStats-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "MenuStats $VERSION" --notes-file notes.md --generate-notes
